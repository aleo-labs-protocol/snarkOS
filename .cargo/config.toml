[target.x86_64-unknown-linux-gnu]
rustflags = [
    # skylake CPU family includes most SSE and AVX2 instructions from about 10 years ago
    # without this, optimization cannot use almost any vector instructions, unless
    # you explicitly set target-cpu yourself when building.
    "-C", "target-cpu=skylake"
]

# `cargo locktick <command>` runs a built-in cargo command with `--cfg locktick`, which swaps
# every lock in `snarkos_utilities::locks` for its `locktick` counterpart, for example
# `cargo locktick build --release`. The `--config` adds to the `rustflags` above rather than
# replacing them. Both builds share one target directory without rebuilding each other.
#
# Hazard: external subcommands such as `clippy`, `nextest` and `hack` do not receive this
# `--config`, so `cargo locktick clippy` checks the code without the cfg. Use
# `cargo locktick-clippy` instead.
#
# Hazard: a `RUSTFLAGS` environment variable replaces every `rustflags` setting, this one
# included. To combine `--cfg locktick` with a `RUSTFLAGS` build, such as the one the
# `tokio_console` feature needs, put `--cfg locktick` in `RUSTFLAGS` itself.
[alias]
locktick = ["--config", "target.'cfg(all())'.rustflags=['--cfg','locktick']"]
locktick-clippy = ["clippy", "--config", "target.'cfg(all())'.rustflags=['--cfg','locktick']"]
