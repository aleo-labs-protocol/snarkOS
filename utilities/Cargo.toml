[package]
name = "snarkos-utilities"
version = "4.13.1"
authors = [ "The Aleo Team <hello@aleo.org>" ]
description = "Utilities for a decentralized operating system"
homepage = "https://aleo.org"
repository = "https://github.com/aleo-labs-protocol/snarkOS"
keywords = [
  "aleo",
  "cryptography",
  "blockchain",
  "decentralized",
  "zero-knowledge"
]
categories = [ "cryptography", "cryptography::cryptocurrencies", "os" ]
license = "Apache-2.0"
edition = "2024"

[features]
test-helpers = [ ]

[dependencies.anyhow]
workspace = true

[target.'cfg(not(shuttle))'.dependencies.tokio]
workspace = true
features = [ "macros", "rt", "signal", "sync" ]

[target.'cfg(shuttle)'.dependencies.tokio]
package = "shuttle-tokio-impl"
version = "0.1.2"
features = [ "macros", "rt", "signal", "sync" ]

[dependencies.tracing]
workspace = true

[dependencies.parking_lot]
workspace = true

[target.'cfg(locktick)'.dependencies.snarkvm]
workspace = true
features = [ "utilities" ]

[target.'cfg(shuttle)'.dependencies.shuttle]
version = "0.9.10"

[target.'cfg(shuttle)'.dependencies.shuttle-parking_lot]
version = "0.12.5"
features = [ "shuttle" ]

[target.'cfg(not(shuttle))'.dev-dependencies.tokio]
workspace = true
features = [ "macros", "rt", "time" ]

[target.'cfg(shuttle)'.dev-dependencies.tokio]
package = "shuttle-tokio-impl"
version = "0.1.2"
features = [ "macros", "rt", "time" ]

[lints]
workspace = true
