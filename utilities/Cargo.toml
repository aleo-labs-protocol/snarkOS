[package]
name = "snarkos-utilities"
version = "4.13.1"
authors = [ "The Aleo Team <hello@aleo.org>" ]
description = "Utilities for a decentralized operating system"
homepage = "https://aleo.org"
repository = "https://github.com/aleo-labs-protocol/snarkOS"
keywords = [
  "aleo",
  "cryptography",
  "blockchain",
  "decentralized",
  "zero-knowledge"
]
categories = [ "cryptography", "cryptography::cryptocurrencies", "os" ]
license = "Apache-2.0"
edition = "2024"

[features]
test-helpers = [ ]
dev-network = [ ]

[dependencies.anyhow]
workspace = true

[dependencies.tokio]
workspace = true
features = [ "macros", "rt", "signal", "sync" ]

[dependencies.tracing]
workspace = true

[dependencies.parking_lot]
workspace = true

[target.'cfg(locktick)'.dependencies.snarkvm]
workspace = true
features = [ "utilities" ]

[dev-dependencies.tokio]
workspace = true
features = [ "macros", "rt", "time" ]

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = [ 'cfg(locktick)' ] }
