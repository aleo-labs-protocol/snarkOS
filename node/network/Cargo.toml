[package]
name = "snarkos-node-network"
version = "4.13.1"
authors = [ "The Aleo Team <hello@aleo.org>" ]
description = "Network-related objects and traits for nodes"
homepage = "https://aleo.org"
repository = "https://github.com/aleo-labs-protocol/snarkOS"
keywords = [
  "aleo",
  "cryptography",
  "blockchain",
  "decentralized",
  "zero-knowledge"
]
categories = [ "cryptography", "cryptography::cryptocurrencies", "os" ]
license = "Apache-2.0"
edition = "2024"

[features]
metrics = [ ]
# Gate code with `cfg(any(test, feature = "test-helpers"))`: the unit tests build without this feature.
test-helpers = [ ]

[dependencies.anyhow]
workspace = true

[dependencies.bytes]
workspace = true

[dependencies.rand]
workspace = true

[dependencies.tracing]
workspace = true

[dependencies.serde]
workspace = true

[dependencies.smol_str]
workspace = true

[dependencies.snarkos-node-tcp]
workspace = true

[dependencies.snarkos-utilities]
workspace = true

[dependencies.snarkvm]
workspace = true
features = [ "console", "utilities" ]

[dependencies.snow]
workspace = true

[dependencies.socket2]
version = "0.6.2"

[dependencies.tokio]
workspace = true
features = [ "io-util", "net" ]

[dependencies.tokio-util]
workspace = true
features = [ "codec" ]

[dev-dependencies.snarkvm]
workspace = true
features = [ "test-helpers" ]

[dev-dependencies.tokio]
workspace = true
features = [ "io-util", "macros", "rt-multi-thread" ]

[build-dependencies.built]
workspace = true
