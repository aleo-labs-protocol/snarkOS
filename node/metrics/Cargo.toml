[package]
name = "snarkos-node-metrics"
version = "4.13.1"
authors = [ "The Aleo Team <hello@aleo.org>" ]
description = "A node for a decentralized operating system"
homepage = "https://aleo.org"
repository = "https://github.com/aleo-labs-protocol/snarkOS"
keywords = [
  "aleo",
  "cryptography",
  "blockchain",
  "decentralized",
  "zero-knowledge"
]
categories = [ "cryptography", "cryptography::cryptocurrencies", "os" ]
license = "Apache-2.0"
edition = "2024"

[features]
default = [ "metrics" ]
metrics = [ "snarkvm/metrics" ]

[dependencies.metrics-exporter-prometheus]
version = "0.13"
default-features = false
features = [ "http-listener" ]

[dependencies.rayon]
workspace = true

[dependencies.snarkos-utilities]
workspace = true

[dependencies.snarkvm]
workspace = true
features = [ "console", "ledger", "metrics" ]

[dependencies.tokio]
workspace = true
features = [ "rt" ]

[dependencies.tracing]
workspace = true

[build-dependencies.built]
workspace = true
