[package]
name = "snarkos-node-consensus"
version = "4.13.1"
authors = [ "The Aleo Team <hello@aleo.org>" ]
description = "A node consensus for a decentralized operating system"
homepage = "https://aleo.org"
repository = "https://github.com/aleo-labs-protocol/snarkOS"
keywords = [
  "aleo",
  "cryptography",
  "blockchain",
  "decentralized",
  "zero-knowledge"
]
categories = [ "cryptography", "cryptography::cryptocurrencies", "os" ]
license = "Apache-2.0"
edition = "2024"

[features]
default = [ ]
metrics = [ "dep:snarkos-node-metrics", "snarkos-node-bft/metrics" ]
cuda = [ "snarkvm/cuda", "snarkos-account/cuda", "snarkos-node-bft-ledger-service/cuda" ]
dev-network = [ "snarkos-node-bft-ledger-service/dev-network" ]

[dependencies.anyhow]
workspace = true

[dependencies.cfg-if]
workspace = true

[dependencies.indexmap]
workspace = true
features = [ "serde", "rayon" ]

[dependencies.lru]
workspace = true

[dependencies.snarkos-node-metrics]
workspace = true
optional = true

[dependencies.snarkos-account]
workspace = true

[dependencies.snarkos-node-bft]
workspace = true

[dependencies.snarkos-node-bft-ledger-service]
workspace = true

[dependencies.snarkos-node-bft-storage-service]
workspace = true

[dependencies.snarkos-node-sync]
workspace = true

[dependencies.snarkos-utilities]
workspace = true

[dependencies.snarkvm]
workspace = true

[dependencies.tokio]
workspace = true
features = [ "macros", "rt-multi-thread", "signal" ]

[dependencies.tracing]
workspace = true

[dev-dependencies.indexmap]
workspace = true

[dev-dependencies.itertools]
workspace = true

[dev-dependencies.once_cell]
workspace = true

[dev-dependencies.snarkos-utilities]
workspace = true
features = [ "test-helpers" ]

[dev-dependencies.snarkvm]
 workspace = true
 features = [ "test-helpers" ]

[dev-dependencies.tracing-test]
workspace = true
