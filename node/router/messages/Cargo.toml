[package]
name = "snarkos-node-router-messages"
version = "4.12.0"
authors = [ "The Aleo Team <hello@aleo.org>" ]
description = "Node messages for a decentralized operating system"
homepage = "https://aleo.org"
repository = "https://github.com/ProvableHQ/snarkOS"
keywords = [
  "aleo",
  "cryptography",
  "blockchain",
  "decentralized",
  "zero-knowledge"
]
categories = [ "cryptography", "cryptography::cryptocurrencies", "os" ]
license = "Apache-2.0"
edition = "2024"

[features]
default = [ ]
test = [ ]
# See the note on the same feature in node/bft/events: this exposes the
# `prop_tests` generators so a fuzzing corpus can be seeded with structurally
# valid messages rather than by mutation from nothing.
fuzz-helpers = [
  "dep:indexmap",
  "dep:proptest",
  "dep:test-strategy",
  "snarkos-node-bft-events/fuzz-helpers",
  "snarkos-node-sync-locators/test",
  "snarkvm/test-helpers",
  "snarkvm/algorithms",
]

[dependencies.bytes]
workspace = true

[dependencies.snarkos-node-network]
workspace = true

[dependencies.snarkos-node-bft-events]
workspace = true

[dependencies.snarkos-node-sync-locators]
workspace = true

[dependencies.snarkos-node-tcp] 
workspace = true

[dependencies.snarkvm]
workspace = true

[dependencies.tokio-util]
workspace = true
features = [ "codec" ]

[dependencies.tracing]
workspace = true

[dev-dependencies.indexmap]
workspace = true

[dev-dependencies.snarkos-node-sync-locators]
workspace = true
features = [ "test" ]

[dev-dependencies.snarkvm]
workspace = true
features = [ "algorithms", "test-helpers" ]

[dependencies.indexmap]
workspace = true
optional = true

[dependencies.proptest]
workspace = true
optional = true

[dependencies.test-strategy]
workspace = true
optional = true

[dev-dependencies.proptest]
workspace = true

[dev-dependencies.test-strategy]
workspace = true
