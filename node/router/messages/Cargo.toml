[package]
name = "snarkos-node-router-messages"
version = "5.0.0"
authors = [ "The Aleo Team <hello@aleo.org>" ]
description = "Node messages for a decentralized operating system"
homepage = "https://aleo.org"
repository = "https://github.com/aleo-labs-protocol/snarkOS"
keywords = [
  "aleo",
  "cryptography",
  "blockchain",
  "decentralized",
  "zero-knowledge"
]
categories = [ "cryptography", "cryptography::cryptocurrencies", "os" ]
license = "Apache-2.0"
edition = "2024"

[features]
default = [ ]
# Exposes the `prop_tests` generators, which seed a fuzzing corpus with
# structurally valid messages. A production build must not enable this feature.
test-helpers = [
  "dep:proptest",
  "dep:snarkos-utilities",
  "dep:test-strategy",
  "snarkos-node-bft-events/test-helpers",
  "snarkos-node-sync-locators/test-helpers",
  "snarkvm/test-helpers",
  "snarkvm/algorithms",
]

[dependencies.bytes]
workspace = true

[dependencies.snarkos-node-network]
workspace = true

[dependencies.snarkos-node-bft-events]
workspace = true

[dependencies.snarkos-node-sync-locators]
workspace = true

[dependencies.snarkos-node-tcp] 
workspace = true

[dependencies.snarkvm]
workspace = true

[dependencies.tokio-util]
workspace = true
features = [ "codec" ]

[dependencies.tracing]
workspace = true

[dev-dependencies.indexmap]
workspace = true

[dependencies.snarkos-utilities]
workspace = true
features = [ "test-helpers" ]
optional = true

[dev-dependencies.snarkos-node-sync-locators]
workspace = true
features = [ "test-helpers" ]

[dev-dependencies.snarkos-utilities]
workspace = true
features = [ "test-helpers" ]

[dev-dependencies.snarkvm]
workspace = true
features = [ "algorithms", "test-helpers" ]

[dependencies.proptest]
workspace = true
optional = true

[dependencies.test-strategy]
workspace = true
optional = true

[dev-dependencies.proptest]
workspace = true

[dev-dependencies.test-strategy]
workspace = true
