[package]
name = "snarkos-node-rest"
version = "4.12.0"
authors = [ "The Aleo Team <hello@aleo.org>" ]
description = "A REST API server for a decentralized virtual machine"
homepage = "https://aleo.org"
repository = "https://github.com/ProvableHQ/snarkOS"
keywords = [
  "aleo",
  "cryptography",
  "blockchain",
  "decentralized",
  "zero-knowledge"
]
categories = [ "cryptography", "cryptography::cryptocurrencies", "os" ]
license = "Apache-2.0"
edition = "2024"

[features]
default = [ ]
# The compile-time history features no longer select snarkVM code.
# The names stay so existing build commands keep resolving.
history = []
history-staking-rewards = []
metrics = [ "dep:snarkos-node-metrics", "snarkos-node-consensus/metrics" ]
cuda = [ "snarkvm/cuda", "snarkos-node-consensus/cuda", "snarkos-node-router/cuda" ]
locktick = [
  "dep:locktick",
  "snarkos-node-consensus/locktick",
  "snarkos-node-router/locktick",
  "snarkvm/locktick"
]
# Lets benches advance a test ledger to the latest consensus version.
test_consensus_heights = [ "snarkvm/test_consensus_heights" ]
serial = [
  "snarkos-node-router/serial",
  "snarkos-node-consensus/serial"
] 

[dependencies.aleo-std]
workspace = true

[dependencies.anyhow]
workspace = true

[dependencies.axum]
workspace = true

[dependencies.axum-extra]
workspace = true
features = [ "erased-json", "typed-header" ]

[dependencies.http]
workspace = true

[dependencies.indexmap]
workspace = true
features = [ "serde", "rayon" ]

[dependencies.jsonwebtoken]
version = "11.1"
default-features = false
features = [ "aws_lc_rs" ]

[dependencies.locktick]
workspace = true
features = [ "parking_lot" ]
optional = true

[dependencies.lru]
workspace = true

[dependencies.once_cell]
workspace = true

[dependencies.parking_lot]
workspace = true

[dependencies.serde]
workspace = true 
features = [ "derive" ]

[dependencies.serde_json]
workspace = true
features = [ "preserve_order" ]

[dependencies.serde_with]
version = "3"

[dependencies.snarkos-node-metrics]
workspace = true
optional = true

[dependencies.snarkos-node-cdn]
workspace = true

[dependencies.snarkos-node-consensus]
workspace = true

[dependencies.snarkos-node-network]
workspace = true

[dependencies.snarkos-node-router]
workspace = true

[dependencies.snarkos-node-sync]
workspace = true

[dependencies.snarkvm]
workspace = true

[dependencies.rand]
workspace = true

[dependencies.reqwest]
workspace = true
features = [ "rustls" ]

[dependencies.rayon]
workspace = true

[dependencies.time]
workspace = true

[dependencies.tokio]
workspace = true

[dependencies.tower_governor]
version = "0.8"
default-features = false
features = [ "axum" ]

[dependencies.tower-http]
version = "0.7"
features = [ "compression-gzip", "cors", "trace" ]

[dependencies.tracing]
workspace = true

[dev-dependencies.base64]
workspace = true

[dev-dependencies.tower]
version = "0.5"
features = ["util"]

[dev-dependencies.snarkos-node-bft-ledger-service]
workspace = true
features = [ "mock" ]

[dev-dependencies.snarkos-node-router]
workspace = true
features = [ "test-helpers" ]

[dev-dependencies.snarkvm]
workspace = true
features = [ "test-helpers" ]

[[bench]]
name = "handlers"
harness = false

[dev-dependencies.criterion]
workspace = true

[build-dependencies.built]
workspace = true
