[package]
name = "snarkos-node-bft-events"
version = "5.0.0"
authors = [ "The Aleo Team <hello@aleo.org>" ]
description = "Events for the gateway in a decentralized operating system"
homepage = "https://aleo.org"
repository = "https://github.com/aleo-labs-protocol/snarkOS"
keywords = [
  "aleo",
  "cryptography",
  "blockchain",
  "decentralized",
  "zero-knowledge"
]
categories = [ "cryptography", "cryptography::cryptocurrencies", "os" ]
license = "Apache-2.0"
edition = "2024"

[features]
default = [ ]
metrics = [ "snarkvm/metrics" ]
# Keep the [dev-dependencies] in sync with this list, and gate code with
# `cfg(any(test, feature = "test-helpers"))`: the unit tests build without this feature.
# Also exposes the `prop_tests` generators, which seed a fuzzing corpus with
# structurally valid events. A production build must not enable this feature.
test-helpers = [
  "dep:proptest",
  "dep:rand",
  "dep:rand_chacha",
  "dep:snarkos-utilities",
  "dep:test-strategy",
  "dep:time",
  "snarkos-node-sync-locators/test-helpers",
  "snarkvm/test-helpers",
  "snarkvm/algorithms"
]

[dependencies.anyhow]
workspace = true

[dependencies.rand]
workspace = true
optional = true

[dependencies.rand_chacha]
workspace = true
optional = true

[dependencies.bytes]
workspace = true

[dependencies.indexmap]
workspace = true
features = [ "serde", "rayon" ]

[dependencies.serde]
workspace = true

[dependencies.snarkos-node-network]
workspace = true

[dependencies.snarkos-node-sync-locators]
workspace = true

[dependencies.snarkos-utilities]
workspace = true
features = [ "test-helpers" ]
optional = true

[dependencies.snarkos-node-tcp]
workspace = true

[dependencies.snarkvm]
workspace = true
features = [ "ledger", "utilities" ]

[dependencies.tokio-util]
workspace = true
features = [ "codec" ]

[dependencies.tracing]
workspace = true

[dependencies.proptest]
workspace = true
optional = true

[[bench]]
name = "serialization"
harness = false

[dev-dependencies.criterion]
workspace = true

[dev-dependencies.snarkvm]
workspace = true
features = [ "test-helpers" ]

[dependencies.test-strategy]
workspace = true
optional = true

[dependencies.time]
workspace = true
optional = true

[dev-dependencies.test-strategy]
workspace = true

[dev-dependencies.time]
workspace = true

[dev-dependencies.snarkos-node-sync-locators]
workspace = true
features = [ "test-helpers" ]

[dev-dependencies.snarkos-utilities]
workspace = true
features = [ "test-helpers" ]

[dev-dependencies.proptest]
workspace = true

[dev-dependencies.rand]
workspace = true

[dev-dependencies.rand_chacha]
workspace = true
