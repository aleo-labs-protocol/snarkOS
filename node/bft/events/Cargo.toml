[package]
name = "snarkos-node-bft-events"
version = "4.12.0"
authors = [ "The Aleo Team <hello@aleo.org>" ]
description = "Events for the gateway in a decentralized operating system"
homepage = "https://aleo.org"
repository = "https://github.com/ProvableHQ/snarkOS"
keywords = [
  "aleo",
  "cryptography",
  "blockchain",
  "decentralized",
  "zero-knowledge"
]
categories = [ "cryptography", "cryptography::cryptocurrencies", "os" ]
license = "Apache-2.0"
edition = "2024"

[features]
default = [ ]
metrics = [ "snarkvm/metrics" ]
test-helpers = [ "dep:rand_chacha", "dep:rand", "dep:proptest" ]
# Exposes the `prop_tests` modules -- the `any_*` generators -- to callers
# outside this crate's own test build. They are the only practical way to seed a
# fuzzing corpus with structurally valid events: without them a mutator spends
# most of its executions failing the version byte at the head of every reader.
#
# Named for what it is rather than folded into `test-helpers`, which already
# means something narrower here (it pulls the rng and proptest dependencies but
# un-gates nothing). Enabling this in a production build would compile the
# generators into the binary, so it is deliberately not implied by anything.
fuzz-helpers = [ "test-helpers", "dep:test-strategy", "dep:time", "snarkos-node-sync-locators/test", "snarkvm/test-helpers", "snarkvm/algorithms" ]

[dependencies.anyhow]
workspace = true

[dependencies.rand]
workspace = true
optional = true

[dependencies.rand_chacha]
workspace = true
optional = true

[dependencies.bytes]
workspace = true

[dependencies.indexmap]
workspace = true
features = [ "serde", "rayon" ]

[dependencies.serde]
workspace = true

[dependencies.snarkos-node-network]
workspace = true

[dependencies.snarkos-node-sync-locators]
workspace = true

[dependencies.snarkos-node-tcp]
workspace = true

[dependencies.snarkvm]
workspace = true
features = [ "ledger", "utilities" ]

[dependencies.tokio-util]
workspace = true
features = [ "codec" ]

[dependencies.tracing]
workspace = true

[dependencies.proptest]
workspace = true
optional = true

[[bench]]
name = "serialization"
harness = false

[dev-dependencies.criterion]
workspace = true

[dev-dependencies.snarkvm]
workspace = true
features = [ "test-helpers" ]

[dependencies.test-strategy]
workspace = true
optional = true

[dependencies.time]
workspace = true
optional = true

[dev-dependencies.test-strategy]
workspace = true

[dev-dependencies.time]
workspace = true

[dev-dependencies.snarkos-node-sync-locators]
workspace = true
features = [ "test" ]

[dev-dependencies.snarkos-node-bft-events]
path = "."
features = [ "test-helpers" ]
