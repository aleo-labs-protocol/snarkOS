[package]
name = "snarkos-node-bft-ledger-service"
version = "4.13.1"
authors = [ "The Aleo Team <hello@aleo.org>" ]
description = "A ledger service for the memory pool in a decentralized operating system"
homepage = "https://aleo.org"
repository = "https://github.com/ProvableHQ/snarkOS"
keywords = [
  "aleo",
  "cryptography",
  "blockchain",
  "decentralized",
  "zero-knowledge"
]
categories = [ "cryptography", "cryptography::cryptocurrencies", "os" ]
license = "Apache-2.0"
edition = "2024"

[features]
default = [ ]
ledger = [ "ledger-write", "parking_lot", "rand", "rayon", "tokio", "tracing" ]
ledger-write = [ ]
locktick = [
  "dep:locktick",
  "snarkvm/locktick",
  "snarkos-utilities/locktick"
]
metrics = [ "dep:snarkos-node-metrics", "snarkvm/metrics" ]
mock = [ "ledger-write", "parking_lot", "tracing" ]
prover = [ ]
cuda = [ "snarkvm/cuda" ]
serial = [
  "snarkvm/serial",
  "snarkos-node-metrics?/serial"
]
test = [ "mock", "translucent" ]
test_network = [
  "snarkvm/dev-committee",
  "snarkvm/dev_genesis_state_root",
  "snarkos-utilities/test_network"
]
translucent = [ "ledger" ]

[dependencies.anyhow]
workspace = true

[dependencies.async-trait]
version = "0.1"

[dependencies.indexmap]
workspace = true
features = [ "serde", "rayon" ]

[dependencies.locktick]
workspace = true
features = [ "parking_lot" ]
optional = true

[dependencies.snarkos-node-metrics]
workspace = true
optional = true

[dependencies.snarkos-utilities]
workspace = true

[dependencies.parking_lot]
workspace = true
optional = true

[dependencies.rand]
workspace = true
optional = true

[dependencies.rayon]
workspace = true
optional = true

[dependencies.snarkvm]
workspace = true
features = [ "console", "ledger", "synthesizer" ]

[dependencies.tokio]
workspace = true
features = [ "macros", "rt-multi-thread" ]
optional = true

[dependencies.thiserror]
workspace = true

[dependencies.tracing]
workspace = true
optional = true
features = [ "log" ]

[dev-dependencies.snarkos-utilities]
workspace = true
features = [ "test-helpers" ]

[dev-dependencies.snarkvm]
workspace = true
features = [ "test-helpers" ]
