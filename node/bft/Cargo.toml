[package]
name = "snarkos-node-bft"
version = "5.0.0"
authors = [ "The Aleo Team <hello@aleo.org>" ]
description = "A memory pool for a decentralized operating system"
homepage = "https://aleo.org"
repository = "https://github.com/aleo-labs-protocol/snarkOS"
keywords = [
  "aleo",
  "cryptography",
  "blockchain",
  "decentralized",
  "zero-knowledge"
]
categories = [ "cryptography", "cryptography::cryptocurrencies", "os" ]
license = "Apache-2.0"
edition = "2024"

[features]
default = [ ]
metrics = [
  "dep:snarkos-node-metrics",
  "snarkos-node-bft-events/metrics",
  "snarkos-node-bft-ledger-service/metrics",
  "snarkos-node-network/metrics"
]
cuda = [
  "snarkvm/cuda",
  "snarkos-account/cuda",
  "snarkos-node-bft-ledger-service/cuda",
  "snarkos-node-sync/cuda"
]
test-helpers = [
  "snarkvm/test-helpers",
  "snarkos-node-bft-ledger-service/test-helpers",
  "snarkos-node-bft-storage-service/test-helpers"
]
dev-network = [
  "snarkos-node-bft-ledger-service/dev-network",
]
# See `cli/Cargo.toml`.
dev-committee-override = [ "snarkos-node-bft-ledger-service/dev-committee-override" ]

[dependencies.anyhow]
workspace = true

[dependencies.async-recursion]
version = "1.0"

[dependencies.async-trait]
workspace = true

[dependencies.bytes]
workspace = true

[dependencies.futures]
workspace = true
features = [ "thread-pool" ]

[dependencies.indexmap]
workspace = true
features = [ "serde", "rayon" ]

[dependencies.lru]
workspace = true

[dependencies.snarkos-node-metrics]
workspace = true
optional = true

[dependencies.rand]
workspace = true

[dependencies.rand_chacha]
workspace = true

[dependencies.rayon]
workspace = true

[dependencies.sha2]
version = "0.11"
default-features = false

[dependencies.smol_str]
workspace = true

[dependencies.snarkos-account]
workspace = true

[dependencies.snarkos-node-bft-events]
workspace = true

[dependencies.snarkos-node-bft-ledger-service]
workspace = true

[dependencies.snarkos-node-bft-storage-service]
workspace = true

[dependencies.snarkos-node-network]
workspace = true

[dependencies.snarkos-node-sync]
workspace = true

[dependencies.snarkos-node-tcp]
workspace = true

[dependencies.snarkos-utilities]
workspace = true

[dependencies.snarkvm]
workspace = true
features = [ "utilities" ]

[dependencies.time]
workspace = true

[dependencies.tokio]
workspace = true
features = [ "macros", "rt-multi-thread", "signal" ]

[dependencies.tokio-util]
workspace = true
features = [ "codec" ]

[dependencies.tracing]
workspace = true

[dependencies.thiserror]
workspace = true

[dev-dependencies.axum]
workspace = true

[dev-dependencies.axum-extra]
workspace = true
features = [ "erased-json" ]

[dev-dependencies.clap]
workspace = true
features = [ "derive" ]

[dev-dependencies.deadline]
version = "0.2"

[dev-dependencies.itertools]
version = "0.15"

[dev-dependencies.open]
version = "5"

[dev-dependencies.paste]
version = "1"

[dev-dependencies.pea2pea]
workspace = true

[dev-dependencies.proptest]
workspace = true

[dev-dependencies.snarkos-node-bft-events]
workspace = true
features = [ "test-helpers" ]

[dev-dependencies.rand_chacha]
workspace = true

[dev-dependencies.rand_distr]
workspace = true

[dev-dependencies.rayon]
workspace = true

[dev-dependencies.snarkos-node-bft]
path = "."
features = [ "test-helpers" ]

[dev-dependencies.snarkos-node-bft-storage-service]
workspace = true
features = [ "test-helpers" ]

[dev-dependencies.snarkos-node-sync]
workspace = true
features = [ "test-helpers" ]

[dev-dependencies.snarkos-utilities]
workspace = true
features = [ "test-helpers" ]

[dev-dependencies.snarkvm]
workspace = true
features = [ "test-helpers" ]

[dev-dependencies.tempfile]
workspace = true

[dev-dependencies.test-strategy]
workspace = true

[dev-dependencies.test-log]
workspace = true

[dev-dependencies.tower-http]
version = "0.7"
features = [ "fs", "trace" ]

[dev-dependencies.tracing-subscriber]
workspace = true
features = [ "env-filter" ]

[dev-dependencies.tracing-test]
workspace = true

[dev-dependencies.mockall]
version = "0.15"
