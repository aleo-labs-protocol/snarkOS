[package]
name = "snarkos-node-sync-communication-service"
version = "4.13.1"
authors = [ "The Aleo Team <hello@aleo.org>" ]
description = "A communication service for the sync module in a decentralized operating system"
homepage = "https://aleo.org"
repository = "https://github.com/aleo-labs-protocol/snarkOS"
keywords = [
  "aleo",
  "cryptography",
  "blockchain",
  "decentralized",
  "zero-knowledge"
]
categories = [ "cryptography", "cryptography::cryptocurrencies", "os" ]
license = "Apache-2.0"
edition = "2024"

[dependencies.async-trait]
version = "0.1"

[target.'cfg(not(shuttle))'.dependencies.tokio]
workspace = true
features = [ "sync" ]

[target.'cfg(shuttle)'.dependencies.tokio]
package = "shuttle-tokio-impl"
version = "0.1.2"
features = [ "sync" ]

[features]
default = [ ]

[lints]
workspace = true
