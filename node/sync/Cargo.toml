[package]
name = "snarkos-node-sync"
version = "4.13.1"
authors = [ "The Aleo Team <hello@aleo.org>" ]
description = "A synchronization module for a decentralized operating system"
homepage = "https://aleo.org"
repository = "https://github.com/aleo-labs-protocol/snarkOS"
keywords = [
  "aleo",
  "cryptography",
  "blockchain",
  "decentralized",
  "zero-knowledge"
]
categories = [ "cryptography", "cryptography::cryptocurrencies", "os" ]
license = "Apache-2.0"
edition = "2024"

[features]
default = [ ]
metrics = [ "dep:snarkos-node-metrics", "snarkos-node-network/metrics" ]
cuda = [ "snarkvm/cuda", "snarkos-node-bft-ledger-service/cuda", "snarkos-node-router/cuda" ]
test-helpers = [ "snarkos-node-sync-locators/test-helpers" ]

[dependencies.anyhow]
workspace = true

[dependencies.indexmap]
workspace = true
features = [ "serde", "rayon" ]

[dependencies.itertools]
workspace = true

[dependencies.futures]
workspace = true

[dependencies.serde]
workspace = true

[dependencies.tokio]
workspace = true
features = [ "sync" ]

[dependencies.thiserror]
workspace = true

[dependencies.rand]
workspace = true

[dependencies.snarkos-node-bft-ledger-service]
workspace = true

[dependencies.snarkos-node-metrics]
workspace = true
optional = true

[dependencies.snarkos-node-network]
workspace = true

[dependencies.snarkos-node-router]
workspace = true

[dependencies.snarkos-node-sync-communication-service]
workspace = true

[dependencies.snarkos-node-sync-locators]
workspace = true

[dependencies.snarkos-utilities]
workspace = true

[dependencies.snarkvm]
workspace = true

[dependencies.tracing]
workspace = true

[dev-dependencies.async-trait]
workspace = true

[dev-dependencies.snarkos-node-bft-ledger-service]
workspace = true
features = [ "test-helpers" ]

[dev-dependencies.snarkos-node-sync-locators]
workspace = true
features = [ "test-helpers" ]

[dev-dependencies.snarkos-node-tcp]
workspace = true

[dev-dependencies.snarkvm]
workspace = true
features = [ "test-helpers" ]

[dev-dependencies.tokio]
workspace = true
features = [ "macros", "rt", "time" ]

[dev-dependencies.tracing-subscriber]
workspace = true
features = [ "env-filter", "fmt" ]
