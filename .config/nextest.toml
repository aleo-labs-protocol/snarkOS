[profile.ci]
fail-fast = false
slow-timeout = { period = "60s", terminate-after = 5 }
status-level = "fail"
# Many tests bind sockets and start nodes, so two run at a time on the hosted
# runners. The fleet `test` job sets NEXTEST_TEST_THREADS instead; see CI.md.
test-threads = 2

[profile.ci.junit]
path = "junit.xml"
