name: CI

on:
  pull_request:
    # A pull request that changes only Markdown starts no run.
    paths-ignore:
      - '**.md'
  push:
    branches: [staging, 'release/**']
  workflow_dispatch:

permissions:
  contents: read

# A superseded PR run holds a one-slot box the new head is queued behind, so a
# new push cancels it. Pushes are grouped by branch and commit instead: a group
# keeps one pending run and drops the rest, and every push to every branch
# needs its own verdict.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || format('{0}-{1}', github.ref, github.sha) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always

# GitHub holds an outside contributor's pull request run until a maintainer
# approves it. A fork's run gets no secrets, so start-cpu-runners is skipped and
# fork-pr-runners.yml starts the boxes. The fleet jobs therefore accept a
# skipped start-cpu-runners, and run only in this repository, which alone may
# use the fleet.
#
# The fleet jobs also wait for check-shared-refs, a hosted job. GitHub reports
# a run as `in_progress`, and fires the `workflow_run` event that starts the
# boxes, only once none of its ready jobs is waiting for a runner. With no
# hosted job ahead of them, a fork's fleet jobs would wait for boxes that only
# that event starts.
jobs:
  start-cpu-runners:
    # gh-actions is ours; check-shared-refs requires a @vN tag here, not a SHA.
    uses: aleo-labs-protocol/gh-actions/.github/workflows/start-runner.yml@v2
    permissions: { id-token: write, contents: read, actions: read }
    secrets:
      runner_app_key: ${{ secrets.RUNNER_APP_KEY }}
    with:
      role-to-assume: ${{ vars.RUNNER_ROLE_ARN }}
      label: cpu
      # Below the default of 3: snarkOS's jobs run ten minutes or more, so a
      # box absorbs fewer of them within the critical path. fork-pr-runners.yml
      # repeats this.
      jobs-per-box: 2
      runner-app-id: ${{ vars.RUNNER_APP_ID }}
    if: >-
      github.event.pull_request == null ||
      github.event.pull_request.head.repo.full_name == github.repository

  check-shared-refs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      # gh-actions is ours; check-shared-refs requires a @vN tag here, not a SHA.
      - uses: aleo-labs-protocol/gh-actions/.github/actions/check-shared-refs@v2
      # An `include` name missing from its `name` axis adds a leg instead of failing.
      - name: Check that each matrix name axis matches its include names
        run: |
          bad=$(yq '.jobs[].strategy.matrix | select(.name != null) | (.name - [.include[].name]) + ([.include[].name] - .name) | .[]' .github/workflows/ci.yml)
          echo "$bad"
          [ -z "$bad" ]

  fmt:
    runs-on: ubuntu-latest
    env:
      # `.rustfmt.toml` uses nightly-only options, which stable drops without
      # an error. Bumping this pin may reformat the tree.
      FMT_TOOLCHAIN: nightly-2026-04-02
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - run: rustup toolchain install "$FMT_TOOLCHAIN" --profile minimal --component rustfmt
      - run: cargo "+$FMT_TOOLCHAIN" fmt --all -- --check

  deny:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2.90.3
        with: { tool: cargo-deny@0.20.2 }
      - run: cargo deny --workspace check bans licenses sources
      # staging's advisories are bumped nightly by bump-advisories.yml, which
      # does not cover the release line.
      - if: github.base_ref != 'staging' && github.ref_name != 'staging'
        run: cargo deny --workspace check advisories

  shellcheck:
    runs-on: ubuntu-latest
    env:
      SHELLCHECK_VERSION: v0.11.0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - run: |
          curl -fsSL "https://github.com/koalaman/shellcheck/releases/download/${SHELLCHECK_VERSION}/shellcheck-${SHELLCHECK_VERSION}.linux.x86_64.tar.xz" \
            | tar -xJ -C "$RUNNER_TEMP"
          "$RUNNER_TEMP/shellcheck-${SHELLCHECK_VERSION}/shellcheck" -x .ci/*.sh scripts/*.sh .github/*.sh

  source-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - run: scripts/check_sources.py

  # The shallow checkout lacks the history the replays of real merges need, so
  # those are skipped here and run locally.
  merge-fixup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - run: .github/merge-fixup.test.sh

  lint:
    needs: [check-shared-refs, start-cpu-runners]
    runs-on: [self-hosted, linux, x64, cpu]
    timeout-minutes: 90
    if: &fleet-if >-
      !cancelled() && needs.check-shared-refs.result == 'success' &&
      contains(fromJSON('["success", "skipped"]'), needs.start-cpu-runners.result) &&
      github.repository == 'aleo-labs-protocol/snarkOS'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      # gh-actions is ours; check-shared-refs requires a @vN tag here, not a SHA.
      - uses: aleo-labs-protocol/gh-actions/.github/actions/runner-job-setup@v2
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      # Two crates without tests, each alone: the workspace pass above unifies
      # features, so it misses a feature one of them fails to declare.
      - run: cargo check -p snarkos-node-metrics --all-features
      - run: cargo check -p snarkos-display --all-features
      # The fuzzing harness builds these two alone with `test-helpers`, which
      # the workspace pass above only sees unified with everything else.
      - run: cargo check -p snarkos-node-router-messages --features test-helpers
      - run: cargo check -p snarkos-node-bft-events --features test-helpers

  lint-locktick:
    needs: [check-shared-refs, start-cpu-runners]
    runs-on: [self-hosted, linux, x64, cpu]
    timeout-minutes: 90
    if: *fleet-if
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      # gh-actions is ours; check-shared-refs requires a @vN tag here, not a SHA.
      - uses: aleo-labs-protocol/gh-actions/.github/actions/runner-job-setup@v2
      # An env RUSTFLAGS replaces `--cfg locktick` without an error, and the
      # build then has no locktick dependency.
      - name: Check that the build sets cfg(locktick)
        run: cargo locktick-clippy -q -p snarkos-utilities --message-format=json | grep '"name":"locktick"' > /dev/null
      - run: cargo locktick-clippy --workspace --all-targets --all-features -- -D warnings

  # Each line of `runs` is one build. `cargo test -p a -p b` unifies the
  # features of a and b, and several crates enable features on their
  # dependencies that change what those dependencies do:
  # `snarkos-node-router/test-helpers`, `snarkos-node-network/test-helpers` and
  # `snarkvm-ledger-block/test` skip checks, and `rocks` and `metrics` select
  # other code paths. Crates share a line only where that unification enables
  # none of these on any crate. Other helper features, such as `mock` and the
  # other crates' `test-helpers`, can still be unified.
  #
  # Cheap entries run on free hosted runners and do not wait for the fleet.
  test-hosted:
    permissions: { contents: read, actions: write }
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: light
            runs: >-
              nextest run -p snarkos-account -p snarkos-utilities -p snarkos-node-tcp
              -p snarkos-node-sync-locators -p snarkos-node-network
          - name: cdn
            runs: nextest run -p snarkos-node-cdn
          - name: messages
            runs: >-
              nextest run -p snarkos-node-bft-events -p snarkos-node-router-messages
              -p snarkos-node-bft-ledger-service
    name: test (${{ matrix.name }})
    steps: &test-steps
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      # gh-actions is ours; check-shared-refs requires a @vN tag here, not a SHA.
      - uses: aleo-labs-protocol/gh-actions/.github/actions/runner-job-setup@v2
      - uses: ./.github/actions/job-home
      # rust-cache hashes every installed toolchain into its key, and the
      # image's `stable` differs between the runner images GitHub rolls out.
      # Hosted only: on a box, other jobs use these toolchains.
      - if: runner.environment == 'github-hosted'
        run: rustup toolchain uninstall stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        if: runner.environment == 'github-hosted'
        with:
          key: ${{ matrix.name }}
          save-if: ${{ github.ref == 'refs/heads/staging' }}
      # rust-cache mints a key per dependency set and removes none.
      - uses: ./.github/actions/rust-cache-prune
        if: runner.environment == 'github-hosted' && github.ref == 'refs/heads/staging'
        with: { key: '${{ matrix.name }}' }
      # Downloaded parameters. A box keeps its own; a hosted runner starts
      # without, and parallel tests downloading the same file can read it
      # half-written.
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: runner.environment == 'github-hosted'
        with: &aleo-resources
          path: ~/.aleo/resources
          key: aleo-resources-${{ matrix.name }}-${{ hashFiles('Cargo.lock') }}
      - uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2.90.3
        with: { tool: cargo-nextest@0.9.114 }
      # Each line of `runs` is one cargo command, split on whitespace with no
      # shell parsing, so its arguments can hold neither quotes nor spaces.
      - name: Test
        env:
          RUNS: ${{ matrix.runs }}
          NEXTEST_PROFILE: ci
          NEXTEST_NO_TESTS: pass
        run: |
          # Under the workspace, wherever CARGO_TARGET_DIR points.
          junit=target/nextest/ci/junit.xml
          mkdir -p "$RUNNER_TEMP/junit"
          rc=0 n=0
          while read -ra args; do
            [ "${#args[@]}" -gt 0 ] || continue
            echo "::group::cargo ${args[*]}"
            start=$SECONDS
            rm -f "$junit"
            cargo "${args[@]}" < /dev/null || rc=1
            echo "::endgroup::"
            echo "${args[*]}: $((SECONDS - start))s" | tee -a "$GITHUB_STEP_SUMMARY"
            if [ -f "$junit" ]; then mv "$junit" "$RUNNER_TEMP/junit/$((n += 1)).xml"; fi
          done <<< "$RUNS"
          exit "$rc"
      # Per-test timings, for deciding what to shard or drop.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() }}
        with:
          name: junit-${{ matrix.name }}
          path: ${{ runner.temp }}/junit
      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: runner.environment == 'github-hosted' && github.ref == 'refs/heads/staging'
        with: *aleo-resources

  test:
    needs: [check-shared-refs, start-cpu-runners]
    permissions: { contents: read, actions: write }
    runs-on: [self-hosted, linux, x64, cpu]
    timeout-minutes: 90
    if: *fleet-if
    env:
      NEXTEST_TEST_THREADS: 16
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: services
            runs: |
              nextest run -p snarkos-node-consensus -p snarkos-cli
              nextest run -p snarkos-node-rest
          - name: node
            runs: nextest run -p snarkos-node -p snarkos-node-bft-storage-service
          # Both lines use `metrics`, which the `snarkos` binary enables by
          # default. `helpers::telemetry` compiles only under it, and a line
          # without it rebuilds the snarkvm and bft crates. nextest skips the
          # tests in examples unless a command names one. `--no-tests=fail`
          # overrides NEXTEST_NO_TESTS, so a command that stops matching any
          # test fails.
          - name: bft
            runs: |
              nextest run -p snarkos-node-bft --features metrics
              nextest run -p snarkos-node-bft --features metrics --example simple_node --no-tests=fail
          # One line for both would turn on `test-helpers` in
          # `snarkos-node-sync` for its own tests. The two lines build the same
          # snarkvm crates.
          - name: router-sync
            runs: |
              nextest run -p snarkos-node-router
              nextest run -p snarkos-node-sync
          # Builds RocksDB, whose bindings need libclang, which hosted runners lack.
          - name: ledger-distribution
            runs: nextest run -p snarkos-ledger-distribution
    name: test (${{ matrix.name }})
    steps: *test-steps

  # The node binary the devnet jobs run, built once per workflow run.
  build-snarkos:
    needs: [check-shared-refs, start-cpu-runners]
    runs-on: [self-hosted, linux, x64, cpu]
    timeout-minutes: 60
    if: *fleet-if
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      # gh-actions is ours; check-shared-refs requires a @vN tag here, not a SHA.
      - uses: aleo-labs-protocol/gh-actions/.github/actions/runner-job-setup@v2
      # The same profile as `ci_cargo_install_snarkos` in .ci/utils.sh, which
      # the upgrade tests build the latest release with.
      - run: cargo build --release --locked --features test_network
        env:
          CARGO_PROFILE_RELEASE_LTO: "off"
          CARGO_PROFILE_RELEASE_CODEGEN_UNITS: "16"
          CARGO_PROFILE_RELEASE_OPT_LEVEL: "2"
          CARGO_PROFILE_RELEASE_DEBUG: "0"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: snarkos
          path: ${{ env.CARGO_TARGET_DIR }}/release/snarkos
          if-no-files-found: error
          retention-days: 3

  # Each entry runs a local devnet of several nodes on fixed ports, so it
  # needs a box to itself; a one-slot box gives it one. Nodes, ports and the
  # loopback qdiscs outlive a job that is cancelled or whose box dies, so each
  # entry clears them before it starts as well as after.
  devnet:
    needs: [start-cpu-runners, build-snarkos]
    runs-on: [self-hosted, linux, x64, cpu]
    timeout-minutes: ${{ matrix.timeout }}
    if: >-
      !cancelled() && needs.build-snarkos.result == 'success' &&
      contains(fromJSON('["success", "skipped"]'), needs.start-cpu-runners.result) &&
      github.repository == 'aleo-labs-protocol/snarkOS'
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: devnet
            timeout: 40
            delay: false
            runs: |
              ./.ci/test_db_backup.sh
              ./.ci/test_devnet.sh
          # Clippy and `cargo check` only compile the examples, so this is the one
          # job that runs one. It builds the example itself.
          - name: simple-node
            timeout: 60
            delay: false
            runs: ./.ci/test_simple_node.sh
    name: devnet (${{ matrix.name }})
    steps: &devnet-steps
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      # gh-actions is ours; check-shared-refs requires a @vN tag here, not a SHA.
      - uses: aleo-labs-protocol/gh-actions/.github/actions/runner-job-setup@v2
      - name: Stop leftover nodes
        run: &stop-nodes |
          pkill -x 'snarkos|simple_node' || true
          for _ in $(seq 20); do pgrep -x 'snarkos|simple_node' > /dev/null || break; sleep 1; done
          pkill -9 -x 'snarkos|simple_node' || true
          sudo -n /usr/local/sbin/runner-netem clear
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: snarkos
          path: ${{ runner.temp }}/bin
      - uses: ./.github/actions/job-home
        with:
          # The upgrade entry also runs the latest release, whose genesis
          # blocks must not land in the cache the PR's binary reads.
          genesis-scope: ${{ matrix.name == 'upgrade' && 'upgrade' || '' }}
      - run: |
          chmod +x "$RUNNER_TEMP/bin/snarkos"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - name: Delay loopback traffic
        if: matrix.delay
        run: sudo -n /usr/local/sbin/runner-netem spikes 5000-5100
      - name: Test
        env:
          RUNS: ${{ matrix.runs }}
        run: bash -eo pipefail -c "$RUNS"
      - name: Stop nodes
        if: always()
        run: *stop-nodes

  # Slower devnets. On every push, on pull requests into a release branch, and
  # on demand.
  devnet-merge:
    needs: [start-cpu-runners, build-snarkos]
    runs-on: [self-hosted, linux, x64, cpu]
    timeout-minutes: ${{ matrix.timeout }}
    if: >-
      !cancelled() && needs.build-snarkos.result == 'success' &&
      contains(fromJSON('["success", "skipped"]'), needs.start-cpu-runners.result) &&
      github.repository == 'aleo-labs-protocol/snarkOS' &&
      (github.event_name != 'pull_request' || startsWith(github.base_ref, 'release/'))
    strategy:
      fail-fast: false
      matrix:
        name: [dev-on-prod-restart, chaotic-minority-reset, chaotic-majority-restart, upgrade]
        include:
          - name: dev-on-prod-restart
            timeout: 45
            runs: ./.ci/test_dev_on_prod_restart.sh
          - name: chaotic-minority-reset
            timeout: 45
            delay: true
            runs: ./.ci/test_reset_minority.sh
          - name: chaotic-majority-restart
            timeout: 45
            delay: true
            runs: ./.ci/test_restart_majority.sh
          # Builds the latest release on a box the first time it sees its tag,
          # in a target dir of its own so the old dependency tree stays out of
          # the one the other jobs build in.
          - name: upgrade
            timeout: 90
            runs: |
              export CARGO_TARGET_DIR="$SNARKOS_RELEASE_DIR/target"
              ./.ci/test_full_upgrade.sh
              ./.ci/test_partial_upgrade.sh
    # No expression: GitHub shows a skipped job's `name` unevaluated.
    name: devnet-merge
    steps: *devnet-steps

  # Devnets for releases only. On every push to a release branch, on pull
  # requests into one, and on demand.
  devnet-release:
    needs: [start-cpu-runners, build-snarkos]
    runs-on: [self-hosted, linux, x64, cpu]
    timeout-minutes: ${{ matrix.timeout }}
    if: >-
      !cancelled() && needs.build-snarkos.result == 'success' &&
      contains(fromJSON('["success", "skipped"]'), needs.start-cpu-runners.result) &&
      github.repository == 'aleo-labs-protocol/snarkOS' &&
      (github.event_name == 'workflow_dispatch' ||
      startsWith(github.ref, 'refs/heads/release/') ||
      startsWith(github.base_ref, 'release/'))
    strategy:
      fail-fast: false
      matrix:
        name: [upgrade-required, chaotic-restart-all]
        include:
          - name: upgrade-required
            timeout: 30
            runs: ./.ci/test_upgrade_required.sh
          - name: chaotic-restart-all
            timeout: 45
            delay: true
            runs: ./.ci/test_restart_all.sh
    name: devnet-release
    steps: *devnet-steps

  # The release binary must compile in no test-only code. `test-helpers` in the
  # event and message crates turns on proptest and snarkVM's `test-helpers`, and
  # feature unification would carry them into the binary if any crate on its
  # path ever enabled it.
  release-graph:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with: { persist-credentials: false }
      - run: |
          cargo tree -p snarkos -e normal,build,features --prefix none --locked > graph.txt
          hits=$(grep -E '^[a-z0-9_-]+ feature "(test-helpers|test)"$|^proptest ' graph.txt | sort -u || true)
          if [ -n "$hits" ]; then
            printf '%s\n' "$hits"
            echo "::error::the snarkos release build enables test-only code (above)"
            exit 1
          fi

  machete:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2.90.3
        with: { tool: cargo-machete@0.7.0 }
      - run: cargo machete

  # Builds cold: the four caches would take about half of the repository's
  # 10 GB and evict the entries the hosted test jobs restore from.
  windows:
    runs-on: windows-latest
    if: github.event_name != 'pull_request' || startsWith(github.base_ref, 'release/')
    env:
      CARGO_NET_GIT_FETCH_WITH_CLI: "true"
    strategy:
      fail-fast: false
      matrix:
        dir: [account, cli, display, node]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - run: cargo check --examples --benches --tests
        working-directory: ${{ matrix.dir }}

  # Each crate alone, with no features and with each feature on its own. The
  # builds above unify features across crates, so they miss a feature that is
  # not forwarded to a dependency, and code gated on the wrong feature. `cuda`
  # needs nvcc. Each feature set checks snarkVM again. On every push to a
  # release branch, and on demand.
  each-feature:
    needs: [check-shared-refs, start-cpu-runners]
    runs-on: [self-hosted, linux, x64, cpu]
    timeout-minutes: 120
    if: >-
      github.event_name != 'pull_request' && !cancelled() &&
      needs.check-shared-refs.result == 'success' &&
      contains(fromJSON('["success", "skipped"]'), needs.start-cpu-runners.result) &&
      github.repository == 'aleo-labs-protocol/snarkOS'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      # gh-actions is ours; check-shared-refs requires a @vN tag here, not a SHA.
      - uses: aleo-labs-protocol/gh-actions/.github/actions/runner-job-setup@v2
      - uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2.90.3
        with: { tool: cargo-hack@0.6.46 }
      - run: cargo hack clippy --workspace --each-feature --exclude-features cuda --locked -- -D warnings

  # The one job to require on protected branches. A skipped job counts as passed
  # for a required check, so every job must succeed here. The exception is a
  # merge or release job skipped outside a release branch, where it is not meant
  # to run.
  ci-ok:
    if: always()
    needs: [check-shared-refs, fmt, deny, shellcheck, source-checks, merge-fixup, machete, release-graph, lint, lint-locktick, test-hosted, test, build-snarkos, devnet, devnet-merge, devnet-release, windows]
    runs-on: ubuntu-latest
    steps:
      - env:
          NEEDS: ${{ toJSON(needs) }}
          RELEASE: >-
            ${{ github.event_name == 'workflow_dispatch' ||
            startsWith(github.ref, 'refs/heads/release/') ||
            startsWith(github.base_ref, 'release/') }}
        run: |
          jq -e --argjson release "$RELEASE" 'to_entries | map(select(.value.result != "success" and ($release or .value.result != "skipped" or (.key | IN("devnet-merge", "devnet-release", "windows") | not)))) | if length == 0 then true else (map("\(.key): \(.value.result)") | join(", ") | halt_error) end' <<< "$NEEDS"
