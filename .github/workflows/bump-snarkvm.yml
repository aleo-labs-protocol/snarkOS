name: Bump snarkVM
on:
  schedule:
    - cron: '0 6 * * 1,4'
  workflow_dispatch:

concurrency:
  group: bump-snarkvm
  cancel-in-progress: false

env:
  SNARKVM_REPO: aleo-labs-protocol/snarkVM
  SNARKVM_BRANCH: staging
  BASE_BRANCH: staging
  PR_BRANCH: ci/bump-snarkvm

jobs:
  bump:
    name: Bump snarkVM to latest staging
    runs-on: ubuntu-latest
    # Admits only runs on staging, so a workflow on any other branch cannot read
    # the app key.
    environment: merge-bot
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.BASE_BRANCH }}
          persist-credentials: false

      - name: Find current and latest snarkVM revisions
        id: revs
        run: |
          current=$(sed -n '/^\[workspace\.dependencies\.snarkvm\]/,/^\[/ s/^rev = "\([0-9a-f]*\)".*/\1/p' Cargo.toml)
          latest=$(git ls-remote "https://github.com/$SNARKVM_REPO.git" "refs/heads/$SNARKVM_BRANCH" | cut -f1)
          if [ -z "$current" ] || [ -z "$latest" ]; then
            echo "Could not determine snarkVM revisions (current='$current', latest='$latest')" >&2
            exit 1
          fi
          echo "current=$current" >> "$GITHUB_OUTPUT"
          echo "latest=$latest" >> "$GITHUB_OUTPUT"
          echo "short=${latest:0:9}" >> "$GITHUB_OUTPUT"

      # The pull request lists the commits between the two revisions. A
      # treeless clone has every commit and no files.
      - name: Fetch snarkVM's history
        if: steps.revs.outputs.current != steps.revs.outputs.latest
        env:
          CURRENT: ${{ steps.revs.outputs.current }}
        run: |
          set -euo pipefail
          dir="$RUNNER_TEMP/snarkVM"
          git clone --quiet --filter=tree:0 --no-checkout --branch "$SNARKVM_BRANCH" "https://github.com/$SNARKVM_REPO.git" "$dir"
          # A diverged pin may be on no branch.
          git -C "$dir" cat-file -e "$CURRENT^{commit}" 2>/dev/null ||
            git -C "$dir" fetch --quiet --filter=tree:0 origin "$CURRENT"

      - name: Install Rust
        if: steps.revs.outputs.current != steps.revs.outputs.latest
        run: rustup toolchain install

      - name: Update snarkVM revision
        if: steps.revs.outputs.current != steps.revs.outputs.latest
        env:
          LATEST: ${{ steps.revs.outputs.latest }}
        run: |
          sed -i "/^\[workspace\.dependencies\.snarkvm\]/,/^\[/ s|^rev = .*|rev = \"$LATEST\" #$SNARKVM_BRANCH|" Cargo.toml
          # `-w` relocks the snarkvm crates to the new rev and keeps every other
          # locked edge. `-p snarkvm` also unlocks their dependencies, and cargo
          # then moves shared edges, such as socket2, to another locked version.
          cargo update -w

      # A push made with github.token starts no workflows, so CI would never run
      # on the pull request. Actions also cannot create pull requests in this
      # organization with github.token.
      - name: Create app token
        if: steps.revs.outputs.current != steps.revs.outputs.latest
        id: app
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.MERGE_BOT_CLIENT_ID }}
          private-key: ${{ secrets.MERGE_BOT_APP_KEY }}
          permission-contents: write
          permission-pull-requests: write
          # The rebuilt branch can carry staging's own workflow changes.
          permission-workflows: write

      - name: Open or update pull request
        if: steps.revs.outputs.current != steps.revs.outputs.latest
        # gh-actions is ours; check-shared-refs requires a @vN tag here, not a SHA.
        uses: aleo-labs-protocol/gh-actions/.github/actions/bump-pr@v2
        with:
          token: ${{ steps.app.outputs.token }}
          app-slug: ${{ steps.app.outputs.app-slug }}
          source-repo: ${{ env.SNARKVM_REPO }}
          source-dir: ${{ runner.temp }}/snarkVM
          source-branch: ${{ env.SNARKVM_BRANCH }}
          current: ${{ steps.revs.outputs.current }}
          latest: ${{ steps.revs.outputs.latest }}
          base-branch: ${{ env.BASE_BRANCH }}
          pr-branch: ${{ env.PR_BRANCH }}
          title: Bump snarkVM to ${{ env.SNARKVM_REPO }}@${{ steps.revs.outputs.short }}
          paths: |
            Cargo.toml
            Cargo.lock
