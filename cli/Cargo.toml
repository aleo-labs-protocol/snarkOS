[package]
name = "snarkos-cli"
version = "4.13.1"
authors = [ "The Aleo Team <hello@aleo.org>" ]
description = "Command-line interface for snarkOS"
homepage = "https://aleo.org"
repository = "https://github.com/aleo-labs-protocol/snarkOS"
keywords = [
  "aleo",
  "cryptography",
  "blockchain",
  "decentralized",
  "zero-knowledge"
]
categories = [ "cryptography", "cryptography::cryptocurrencies", "os" ]
license = "Apache-2.0"
edition = "2024"

[features]
default = [ ]
metrics = [ "dep:snarkos-node-metrics", "snarkos-node/metrics" ]
cuda = [
  "snarkvm/cuda",
  "snarkos-account/cuda",
  "snarkos-node/cuda",
  "snarkos-node-cdn/cuda",
  "snarkos-node-rest/cuda"
]
# Lowers network parameters (consensus heights, genesis targets) and enables the dev genesis state root,
# for local test and development networks. Never enable it to join a public
# network, including testnet. Such a build rejects the shipped genesis block at startup, as its genesis
# targets differ. The router handshake rejects a peer with another genesis header, and the gateway one
# that sends another genesis hash; peers below `HandshakeTrailer::GENESIS_VERSION` may send none.
# `snarkos developer` commands sent to a public endpoint pass no genesis check and use the lowered
# consensus heights.
dev-network = [ "snarkvm/dev-network" ]
# Lets `--dev-on-prod` extend a copy of a real ledger with blocks signed by a deterministic dev
# committee. It keeps the production network parameters, so it is separate from `dev-network`, and a
# build with both rejects `--dev-on-prod`. It relaxes some block and BFT checks for dev-committee rounds.
# Never enable it to join a public network.
dev-committee-override = [ "snarkos-node/dev-committee-override" ]
tokio_console = [ "dep:console-subscriber", "tokio/tracing" ]

[dependencies.anstyle]
version = "1"

[dependencies.anyhow]
workspace = true

[dependencies.base64]
workspace = true

[dependencies.clap]
workspace = true
features = [ "derive", "color", "unstable-styles", "help", "cargo", "usage", "suggestions" ]

[dependencies.colored]
workspace = true

[dependencies.console-subscriber]
version = "0.5"
optional = true

[dependencies.crossterm]
workspace = true

[dependencies.indexmap]
workspace = true
features = [ "serde", "rayon" ]

[dependencies.num_cpus]
workspace = true

[dependencies.rand]
workspace = true

[dependencies.rand_chacha]
workspace = true

[dependencies.rayon]
workspace = true

[dependencies.rpassword]
version = "7.4.0"

[dependencies.self_update]
version = "1.0.0-rc.6"
features = [ "archive-zip", "compression-zip-deflate" ]

[dependencies.serde]
workspace = true

[dependencies.serde_json]
workspace = true
features = [ "preserve_order" ]

[dependencies.snarkos-account]
workspace = true

[dependencies.snarkos-display]
workspace = true

[dependencies.snarkos-node]
workspace = true

[dependencies.snarkos-node-cdn]
workspace = true

[dependencies.snarkos-node-metrics]
workspace = true
optional = true

[dependencies.snarkos-node-rest]
workspace = true

[dependencies.snarkos-utilities]
workspace = true

[dependencies.snarkvm]
workspace = true
features = [ "parameters", "circuit", "package", "rocks" ]

[dependencies.sys-info]
version = "0.9"

[dependencies.tempfile]
workspace = true

[dependencies.time]
workspace = true
features = [ "formatting" ]

[dependencies.thiserror]
workspace = true

[dependencies.tokio]
workspace = true
features = [ "rt" ]

[dependencies.tracing]
workspace = true

[dependencies.tracing-subscriber]
workspace = true
features = [ "env-filter" ]

[dependencies.ureq]
version = "3"
features = ["json"]
default-features = true

[dependencies.zeroize]
version = "1"
features = [ "derive" ]

[dev-dependencies.snarkvm]
workspace = true
features = [ "test-helpers" ]

[target."cfg(target_family = \"unix\")".dependencies.nix]
version = "0.32"
default-features = false
features = [ "resource" ]

[target.'cfg(unix)'.dependencies]
rlimit = "0.11"
